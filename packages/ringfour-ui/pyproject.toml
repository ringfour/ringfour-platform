[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ringfour-ui"
version = "0.1.0.dev0"
description = "Optional Gradio theme and robotics map renderer for Ringfour missions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio==6.32.0",
    "numpy>=1.24",
    "pillow>=13",
    "ringfour-sdk>=0.1.0.dev0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/ringfour_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
ringfour-sdk = { path = "../../../ringfour-sdk", editable = true }
