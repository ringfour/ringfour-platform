openapi: 3.1.0
info:
  title: Ringfour local development API
  version: '0.1.0'
  description: |
    HTTPS API served by the enrolled device daemon on the LAN. Local development
    grants are short-lived bearer credentials delivered only to the CLI. Artifact
    bytes remain on the device and Runner; they are not uploaded to the Platform.
paths:
  /v1/local/dev-sessions/{session_id}/executions/{execution_id}/artifacts:
    get:
      operationId: listLocalDevelopmentArtifacts
      summary: List artifacts from one terminal development execution
      description: |
        The execution must belong to the named development session. A local grant
        with output scope is required. The response contains only the Runner's
        immutable artifact snapshot manifest; it does not expose execution files
        or artifact contents.
      security:
        - LocalDevelopmentGrant: []
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Artifact snapshot manifest and collection result
          content:
            application/json:
              schema: { $ref: ../schemas/dev-sessions/v1/artifact-list.schema.json }
        '401': { description: Local grant missing, expired or invalid }
        '404': { description: Execution does not belong to this session }
        '409': { description: Execution is not terminal }
        '503': { description: Runner unavailable }
  /v1/local/dev-sessions/{session_id}/executions/{execution_id}/artifacts/download:
    get:
      operationId: downloadLocalDevelopmentArtifact
      summary: Stream one verified artifact from the local Runner
      description: |
        The execution must belong to the named development session and be
        terminal. The path must identify an artifact in its immutable snapshot.
        A local grant with output scope is required. The daemon streams bytes
        from Runner without buffering the complete artifact or sending it to
        the Platform.
      security:
        - LocalDevelopmentGrant: []
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      responses:
        '200':
          description: Artifact bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: Invalid artifact path }
        '401': { description: Local grant missing, expired or invalid }
        '404': { description: Execution or artifact is unavailable }
        '409': { description: Execution is not terminal }
        '503': { description: Runner snapshot or local storage unavailable }
components:
  securitySchemes:
    LocalDevelopmentGrant:
      type: http
      scheme: bearer
      description: Short-lived local grant; never a human or Platform API token.
