openapi: 3.1.0
info:
  title: Ringfour API
  version: "0.1.0"
  description: |
    Ringfour hosted App API: identity, organizations, robots, OCI App publication,
    installation, execution, settings, output, artifacts, Logbook and interactions.
    All /v1 endpoints require an Auth0 RS256 access token for audience
    https://api.ringfour.eu and share the error envelope referenced below,
    except the /v1/device/* endpoints which authenticate by possession of an
    enrollment token or robot credential instead.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local Compose stack
tags:
  - name: apps
    description: App catalog, installation, execution and runtime integration.
  - name: health
    description: Infrastructure health; no authentication, no product data.
  - name: identity
    description: Human identity, organizations and membership (Auth0 JWT required).
  - name: robots
    description: Robot records and credential lifecycle (Auth0 JWT required).
  - name: device
    description: Local-daemon-facing enrollment, credential verification and the authenticated WebSocket connection; no human token.
  - name: logbook
    description: Milestone 08 event ingestion and organization history (new Ringfour design).
  - name: interactions
    description: Milestone 09 durable human interactions; hosted submissions remain provisional until device confirmation.
paths:
  /v1/device/app-protocol/negotiate:
    post:
      tags:
      - device
      - apps
      operationId: negotiateDeviceAppProtocol
      x-implementation-status: implemented
      description: After unchanged v1 welcome, negotiate App payload support for this exact active session and stable
        deployment namespace. No common version returns daemon_upgrade_required. Never dispatch App commands before
        success.
      parameters:
      - &device_id002
        name: x-ringfour-credential-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - &device_id003
        name: x-ringfour-credential-secret
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Authorized result; no App execution is started
          content:
            application/json:
              schema:
                $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/negotiation_response
        '400': &device_id004
          description: Invalid App protocol input
          content:
            application/json:
              schema: &device_id001
                $ref: ../schemas/errors/v2/app-error.schema.json
        '401': &device_id005
          description: Invalid machine credential or human authentication
          content:
            application/json:
              schema: *device_id001
        '404': &device_id006
          description: Missing, inaccessible or unsupported endpoint
          content:
            application/json:
              schema: *device_id001
        '409': &device_id007
          description: Stale session, unsupported App protocol, sequence gap or conflicting replay
          content:
            application/json:
              schema: *device_id001
        '413': &device_id008
          description: Report exceeds 65536 UTF-8 bytes
          content:
            application/json:
              schema: *device_id001
        '503': &device_id009
          description: State store unavailable
          content:
            application/json:
              schema: *device_id001
      security:
      - deviceCredentialId: []
        deviceCredentialSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/negotiation_request
  /v1/device/app-inventory:
    put:
      tags:
      - device
      - apps
      operationId: reportDeviceAppInventory
      x-implementation-status: implemented
      description: Current negotiated session reports observed Agent inventory and engine target. Retain cached observation
        as explanatory only. Durable report ID/sequence replay is independent of reconnect session headers.
      parameters:
      - *device_id002
      - *device_id003
      - name: x-ringfour-device-session
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized result; no App execution is started
          content:
            application/json:
              schema:
                $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/report_accepted
        '400': *device_id004
        '401': *device_id005
        '404': *device_id006
        '409': *device_id007
        '413': *device_id008
        '503': *device_id009
      security:
      - deviceCredentialId: []
        deviceCredentialSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/inventory_report
  /v1/device/app-observations:
    put:
      tags:
      - device
      - apps
      operationId: reportDeviceAppObservations
      x-implementation-status: implemented
      description: Atomically record bounded App operation, installation and run observations. Derive robot, organization
        and actors from durable authority. Do not promote installed/running from an acknowledgement.
      parameters:
      - *device_id002
      - *device_id003
      - name: x-ringfour-device-session
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized result; no App execution is started
          content:
            application/json:
              schema:
                $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/report_accepted
        '400': *device_id004
        '401': *device_id005
        '404': *device_id006
        '409': *device_id007
        '413': *device_id008
        '503': *device_id009
      security:
      - deviceCredentialId: []
        deviceCredentialSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/observations
  /v1/device/app-revisions/{revision_id}:
    get:
      tags:
      - device
      - apps
      operationId: getDeviceAppRevision
      x-implementation-status: implemented
      description: Resolve a manifest only for an authorized nonterminal operation on the authenticated robot. A known
        revision UUID does not authorize retrieval. App commands contain no expiring URLs or registry tokens.
      parameters:
      - *device_id002
      - *device_id003
      - name: x-ringfour-device-session
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: operation_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized result; no App execution is started
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/revision
        '400': *device_id004
        '401': *device_id005
        '404': *device_id006
        '409': *device_id007
        '413': *device_id008
        '503': *device_id009
      security:
      - deviceCredentialId: []
        deviceCredentialSecret: []
  /v1/robots/{robot_id}/app-status:
    get:
      tags:
      - robots
      - apps
      operationId: getRobotAppStatus
      x-implementation-status: implemented
      description: Workspace member reads current session support and last-received target/inventory. Offline status
        retains timestamps and never authorizes a current capability check.
      parameters:
      - name: robot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized result; no App execution is started
          content:
            application/json:
              schema:
                $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/robot_app_status
        '400': *device_id004
        '401': *device_id005
        '404': *device_id006
        '409': *device_id007
        '413': *device_id008
        '503': *device_id009
  /v1/robots/{robot_id}/app-compatibility:
    get:
      tags:
      - robots
      - apps
      operationId: previewAppCompatibility
      x-implementation-status: implemented
      description: Workspace member previews an accessible revision against last-known inventory. This preview does
        not pull, install or authorize dispatch; the Daemon must recheck current inventory before pull and start.
      parameters:
      - name: robot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: share_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized result; no App execution is started
          content:
            application/json:
              schema:
                $ref: ../schemas/device/apps/v1/protocol.schema.json#/$defs/compatibility
        '400': *device_id004
        '401': *device_id005
        '404': *device_id006
        '409': *device_id007
        '413': *device_id008
        '503': *device_id009
  /v1/app-installations/{installation_id}/configuration-revisions:
    get:
      tags: [apps]
      operationId: listAppliedAppConfigurations
      x-implementation-status: implemented
      description: Retained configurations confirmed applied to this exact installation, for rollback review. Workspace operator read authority; mutations still require developer authority and current binding guards.
      parameters:
      - {name: installation_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Applied configurations in stable creation order
          content:
            application/json:
              schema: {$ref: ../schemas/apps/v1/api.schema.json#/$defs/configuration_revision_page}
        '400':
          description: App API error
          content:
            application/json:
              schema: {$ref: ../schemas/errors/v2/app-error.schema.json}
        '401':
          description: App API error
          content:
            application/json:
              schema: {$ref: ../schemas/errors/v2/app-error.schema.json}
        '403':
          description: App API error
          content:
            application/json:
              schema: {$ref: ../schemas/errors/v2/app-error.schema.json}
        '404':
          description: App API error
          content:
            application/json:
              schema: {$ref: ../schemas/errors/v2/app-error.schema.json}
        '409':
          description: App API error
          content:
            application/json:
              schema: {$ref: ../schemas/errors/v2/app-error.schema.json}
        '503':
          description: App API error
          content:
            application/json:
              schema: {$ref: ../schemas/errors/v2/app-error.schema.json}
  /v1/app-installations/{installation_id}/configuration-revisions/{configuration_revision_id}:
    get:
      tags: [apps]
      operationId: getAppConfigurationRevision
      x-implementation-status: implemented
      description: Read an immutable configuration revision only within this installation and its workspace. New Ringfour design.
      parameters:
        - { name: installation_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: configuration_revision_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Immutable validated values
          content:
            application/json:
              schema: { $ref: '../schemas/apps/v1/api.schema.json#/$defs/configuration_revision' }
        '400': { description: Invalid input, content: { application/json: { schema: { $ref: '../schemas/errors/v2/app-error.schema.json' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '../schemas/errors/v2/app-error.schema.json' } } } }
        '404': { description: Missing or inaccessible configuration, content: { application/json: { schema: { $ref: '../schemas/errors/v2/app-error.schema.json' } } } }
        '409': { description: State conflict, content: { application/json: { schema: { $ref: '../schemas/errors/v2/app-error.schema.json' } } } }
        '503': { description: Storage unavailable, content: { application/json: { schema: { $ref: '../schemas/errors/v2/app-error.schema.json' } } } }
  /v1/organizations/{org_id}/apps/{app_key}/registry-upload:
    post:
      tags: [apps]
      operationId: authorizeAppRegistryUpload
      description: Reserve the App repository and issue a scoped, expiring Docker exchange credential to an owner or developer.
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: app_key, in: path, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Repository assignment and temporary Docker credential
          content:
            application/json:
              schema:
                type: object
                required: [registry, repository, credential, expires_at]
                properties:
                  registry: { type: string }
                  repository: { type: string }
                  credential: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { description: Invalid App key }
        '401': { description: Authentication required }
        '403': { description: Insufficient workspace role }
        '404': { description: Workspace unavailable or managed registry disabled }
  /registry/token:
    get:
      tags: [apps]
      operationId: exchangeAppRegistryToken
      description: OCI Distribution token exchange using a Ringfour user bearer token or a temporary Basic upload credential.
      security:
        - bearerAuth: []
        - registryUploadAuth: []
      parameters:
        - { name: service, in: query, required: true, schema: { type: string } }
        - name: scope
          in: query
          schema: { type: array, items: { type: string }, maxItems: 8 }
      responses:
        '200':
          description: Expiring token with the authorized subset of requested repository actions
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in, issued_at]
                properties:
                  token: { type: string }
                  expires_in: { type: integer }
                  issued_at: { type: string, format: date-time }
        '400': { description: Invalid service or scopes }
        '401': { description: Missing or invalid exchange credentials }
        '403': { description: No requested permissions granted }
        '404': { description: Managed registry disabled }
        '429': { description: Rate limit exceeded }
  /v1/organizations/{org_id}/app-revisions:
    post:
      tags:
      - apps
      operationId: publishAppRevision
      x-implementation-status: implemented
      description: Owner/developer publishes verified immutable release metadata. Derive publisher from org membership,
        never the manifest. New Ringfour design; see docs/apps-api-contract.md.
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/AppIdempotencyKey'
      responses:
        '201':
          description: Authorized scoped result
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/revision
        '400': &id002
          description: Invalid App input or configuration
          content:
            application/json:
              schema: &id001
                $ref: ../schemas/errors/v2/app-error.schema.json
        '401': &id003
          description: Authentication required
          content:
            application/json:
              schema: *id001
        '403': &id004
          description: Insufficient role
          content:
            application/json:
              schema: *id001
        '404': &id005
          description: Missing or inaccessible scoped resource
          content:
            application/json:
              schema: *id001
        '409': &id006
          description: Revision, execution, precondition or idempotency conflict
          content:
            application/json:
              schema: *id001
        '413': &id007
          description: Request exceeds documented byte limit
          content:
            application/json:
              schema: *id001
        '503': &id008
          description: Required dependency unavailable
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/apps/v1/requests.schema.json#/$defs/publish
  /v1/device/app-registry-grants:
    post:
      tags: [device, apps]
      operationId: getDeviceAppRegistryGrant
      x-implementation-status: implemented
      description: Refresh a pull-only, at most five-minute registry credential for the authenticated robot's active preparation operation and exact candidate image. No credentials are persisted in operations.
      security: [{deviceCredentialId: [], deviceCredentialSecret: []}]
      parameters:
        - {name: x-ringfour-credential-id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: x-ringfour-credential-secret, in: header, required: true, schema: {type: string}}
        - {name: x-ringfour-device-session, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/apps/v1/requests.schema.json#/$defs/registry_grant'}
      responses:
        '200':
          description: Ephemeral pull authority; repository-scoped bearer grants still require exact digest enforcement on the device
          content:
            application/json:
              schema: {$ref: '../schemas/apps/v1/api.schema.json#/$defs/registry_grant'}
        '400':
          description: Invalid input
          content:
            application/json:
              schema: {$ref: '../schemas/errors/v2/app-error.schema.json'}
        '401':
          description: Machine authentication required
          content:
            application/json:
              schema: {$ref: '../schemas/errors/v2/app-error.schema.json'}
        '404':
          description: No authorized operation or candidate
          content:
            application/json:
              schema: {$ref: '../schemas/errors/v2/app-error.schema.json'}
        '409':
          description: Session, support or deadline conflict
          content:
            application/json:
              schema: {$ref: '../schemas/errors/v2/app-error.schema.json'}
        '413':
          description: Body limit exceeded
          content:
            application/json:
              schema: {$ref: '../schemas/errors/v2/app-error.schema.json'}
        '503':
          description: Registry unavailable
          content:
            application/json:
              schema: {$ref: '../schemas/errors/v2/app-error.schema.json'}
  /v1/organizations/{org_id}/apps:
    get:
      tags: [apps]
      operationId: listPublishedWorkspaceApps
      description: List Apps with a published release from this workspace, regardless of discovery visibility.
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Apps published by the workspace and the latest publisher’s display name when available
          content:
            application/json:
              schema: { $ref: '../schemas/apps/v1/api.schema.json#/$defs/app_page' }
        '400': { description: Invalid paging parameters }
        '401': { description: Authentication required }
        '404': { description: Workspace unavailable }
  /v1/store/apps:
    get:
      tags:
      - apps
      operationId: searchStoreApps
      x-implementation-status: implemented
      description: Authenticated workspace members discover listed Apps and can include their own workspace’s private releases.
        New Ringfour design; see docs/apps-api-contract.md.
      parameters:
      - &id009
        name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - &id010
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: organization_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: include_owned
        in: query
        required: false
        schema: { type: boolean, default: false }
      responses:
        '200':
          description: Authorized scoped result
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/app_page
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/app-installations/{installation_id}/settings:
    get:
      tags: [apps]
      operationId: getAppInstallationSettings
      x-implementation-status: implemented
      description: Read selected next-start settings and exact-run application state. Values remain workspace scoped; see docs/apps-ap17-contract.md.
      parameters:
      - {name: installation_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized startup/live settings state, content: {application/json: {schema: {$ref: ../schemas/apps/v2/settings.schema.json#/$defs/settings_state}}}}
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '503': *id008
    post:
      tags: [apps]
      operationId: saveAppInstallationSettings
      x-implementation-status: implemented
      description: Compare-and-set a complete live settings object for next start or one exact active run. Requires idempotency and current feature support; see docs/apps-ap17-contract.md.
      parameters:
      - {name: installation_id, in: path, required: true, schema: {type: string, format: uuid}}
      - $ref: '#/components/parameters/AppIdempotencyKey'
      responses:
        '200': {description: Saved for next start, content: {application/json: {schema: {$ref: ../schemas/apps/v2/settings.schema.json#/$defs/saved_for_next_start}}}}
        '202': {description: Active run application pending, content: {application/json: {schema: {$ref: ../schemas/apps/v2/settings.schema.json#/$defs/pending_application}}}}
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../schemas/apps/v2/settings.schema.json#/$defs/settings_write}
  /v1/app-installations/{installation_id}/settings/revisions/{revision_id}:
    get:
      tags: [apps]
      operationId: getAppInstallationSettingsRevision
      x-implementation-status: implemented
      description: Read one immutable settings revision within its installation and workspace.
      parameters:
      - {name: installation_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: revision_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized immutable settings revision, content: {application/json: {schema: {$ref: ../schemas/apps/v2/settings.schema.json#/$defs/revision}}}}
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '503': *id008
  /v1/apps/{app_id}:
    get:
      tags:
      - apps
      operationId: getApp
      x-implementation-status: implemented
      description: Resolve a listed, published-by-member, directly shared or imported App within current actor authority. New Ringfour
        design; see docs/apps-api-contract.md.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized scoped result
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/app
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/apps/{app_id}/revisions:
    get:
      tags:
      - apps
      operationId: listAppRevisions
      x-implementation-status: implemented
      description: Return revisions independently authorized by listed status, publisher membership, valid share or
        existing import. New Ringfour design; see docs/apps-api-contract.md.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id009
      - *id010
      responses:
        '200':
          description: Authorized scoped result
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/revision_page
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/app-revisions/{revision_id}:
    get:
      tags:
      - apps
      operationId: getAppRevision
      x-implementation-status: implemented
      description: Return one authorized immutable release. A known ID alone grants no access. New Ringfour design;
        see docs/apps-api-contract.md.
      parameters:
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: share_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized scoped result
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/revision
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/app-revisions/{revision_id}/shares:
