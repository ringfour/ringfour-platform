            application/json:
              schema: { $ref: ../schemas/interactions/v1/page.schema.json }
        '400': { description: Invalid filter or cursor }
        '401': { description: Authentication required }
        '404': { description: Organization inaccessible }
  /v1/interactions/{request_id}:
    parameters:
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [interactions]
      operationId: getInteraction
      responses:
        '200':
          description: Organization-scoped interaction detail
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '401': { description: Authentication required }
        '404': { description: Interaction inaccessible }
  /v1/interactions/{request_id}/responses:
    parameters:
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [interactions]
      operationId: respondToInteraction
      description: |
        Atomically accept the first authorized, valid, unexpired response. The
        result is submitted for device delivery, not proof the daemon applied it
        or the App resumed. Identical Idempotency-Key replay returns the same
        response; another key after a winner receives 409.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/interactions/v1/response-request.schema.json }
      responses:
        '202':
          description: Response durably submitted; device confirmation is pending
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/response-accepted.schema.json }
        '400': { description: Invalid choice or idempotency key }
        '401': { description: Authentication required }
        '403': { description: Operator role required }
        '404': { description: Interaction inaccessible }
        '409': { description: Already answered, timed out, cancelled, or won by another response }
        '410': { description: Hosted deadline has passed }

  /v1/device/logbook/events:
    post:
      tags: [logbook, device]
      operationId: ingestDeviceLogbookEvents
      description: Commit a contiguous device event batch before acknowledging it; the authenticated credential determines the robot. Agent motion records have no inferred Platform operation, execution, or human actor.
      security: []
      parameters:
        - { name: x-ringfour-credential-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-ringfour-credential-secret, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/logbook/v1/device-batch.schema.json }
      responses:
        '200':
          description: Highest contiguous sequence durably stored for this robot
          content:
            application/json:
              schema: { $ref: ../schemas/logbook/v1/device-checkpoint.schema.json }
        '400': { description: Invalid event or batch }
        '401': { description: Invalid machine credential }
        '409': { description: Sequence gap, conflicting replay, or mismatched robot or operation }
        '413': { description: Batch exceeds the request size limit }
        '503': { description: Durable storage unavailable }
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Process liveness
      description: Reports only that the process is alive. Never performs dependency checks.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "../schemas/health/v1/liveness-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/health/v1/liveness-ok.json"
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness including owned dependencies
      description: |
        Checks the dependencies this service owns: API checks PostgreSQL and
        its configured private storage.
        Responds 200 when every check passes, 503 otherwise. The body uses
        the same readiness schema in both cases.
      security: []
      responses:
        "200":
          description: All dependency checks pass.
          content:
            application/json:
              schema:
                $ref: "../schemas/health/v1/readiness-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/health/v1/readiness-ok.json"
        "503":
          description: At least one dependency check fails.
          content:
            application/json:
              schema:
                $ref: "../schemas/health/v1/readiness-response.schema.json"
              examples:
                fail:
                  $ref: "../fixtures/health/v1/readiness-fail.json"
  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Resolve the caller
      description: |
        Resolves the Auth0 subject to a local user, creating the user on first
        call (safe under concurrent first requests). Returns the user and all
        of the caller's memberships.
      responses:
        "200":
          description: The caller's user and memberships.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/me-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/identity/v1/me.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [identity]
      operationId: updateMyProfile
      summary: Update the caller's profile
      description: Updates the caller's display name, HTTPS profile picture URL, and phone number. Email remains managed by the verified identity provider profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/update-user-profile-request.schema.json"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/user.schema.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/organizations:
    post:
      tags: [identity]
      operationId: createOrganization
      summary: Create an organization
      description: |
        Self-service organization creation for any authenticated user. The
        organization and the caller's owner membership are created in one
        transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/create-organization-request.schema.json"
      responses:
        "201":
          description: Organization created; the caller is its owner.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/organization.schema.json"
              examples:
                created:
                  $ref: "../fixtures/identity/v1/organization.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [identity]
      operationId: listOrganizations
      summary: List the caller's organizations
      description: Lists organizations the caller belongs to, with the caller's role in each.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of organizations.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/organization-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/identity/v1/organizations-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/organizations/{org_id}:
    delete:
      tags: [identity]
      operationId: deleteOrganization
      summary: Delete an organization (Owner only)
      description: |
        Explicit owner-authorized deletion, including when the caller is the sole
        remaining member. Console asks for confirmation. All memberships are removed,
        robot credentials and pending invitations/enrollment tokens are revoked,
        live device sessions are disconnected, and new shares are revoked.
        The organization disappears from members' workspaces. Users and their other
        organizations are unchanged. A tombstone and immutable history/revisions are
        retained to preserve audit evidence and Apps already imported by other orgs;
        the deleted publisher is removed from Store discovery.
        Stop and uninstall Apps and wait for pending operations before deletion.
        Installed Apps, active runs or pending operations return 409 organization_has_apps.
        A non-member, unknown organization or repeated deletion returns 404.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "204":
          description: Organization deleted and access revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stop/uninstall Apps and finish pending operations first.
          content:
            application/json:
              schema:
                $ref: "../schemas/errors/v1/error.schema.json"
  /v1/organizations/{org_id}/members:
    get:
      tags: [identity]
      operationId: listMembers
      summary: List organization members
      description: Any member may list. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of memberships.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/member-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/identity/v1/members-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [identity]
      operationId: addMember
      summary: Add a member
      description: |
        Owner-only. The target user must already exist (has completed a first
        login). Adding an existing member is a 409 conflict.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/add-member-request.schema.json"
      responses:
        "201":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/membership.schema.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/organizations/{org_id}/members/me:
    delete:
      tags: [identity]
      operationId: leaveOrganization
      summary: Leave an organization
      description: |
        Removes only the authenticated caller's membership. Available to Operator,
        Developer and Owner members. No request body is required; the target is
        always the authenticated caller.
        The caller immediately loses organization access, while the organization,
        robots, Apps and historical evidence remain unchanged. A sole owner must
        first make another member an Owner, or explicitly delete the organization if
        they are its sole member; leaving as the last owner returns 409
        with error code last_owner. Concurrent leaves/removals/demotions are
        serialized per organization to preserve at least one owner.
        A non-member, unknown organization or repeated leave returns 404.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "204":
          description: The caller's membership was removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The caller is the organization's last owner.
          content:
            application/json:
              schema:
                $ref: "../schemas/errors/v1/error.schema.json"
              examples:
                lastOwner:
                  $ref: "../fixtures/errors/v1/last-owner.json"
  /v1/organizations/{org_id}/members/{user_id}:
    patch:
      tags: [identity]
      operationId: updateMemberRole
      summary: Change a member's role
      description: |
        Owner-only. Demoting the last remaining owner is a 409 conflict with
        error code last_owner.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/update-member-request.schema.json"
      responses:
        "200":
          description: Membership updated.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/membership.schema.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Last-owner protection triggered.
          content:
            application/json:
              schema:
                $ref: "../schemas/errors/v1/error.schema.json"
              examples:
                lastOwner:
                  $ref: "../fixtures/errors/v1/last-owner.json"
    delete:
      tags: [identity]
      operationId: removeMember
      summary: Remove a member
      description: |
        Owner-only. Removing the last remaining owner is a 409 conflict with
        error code last_owner.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Membership removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Last-owner protection triggered.
          content:
            application/json:
              schema:
                $ref: "../schemas/errors/v1/error.schema.json"
              examples:
                lastOwner:
                  $ref: "../fixtures/errors/v1/last-owner.json"
  /v1/organizations/{org_id}/invitation-codes:
    post:
      tags: [identity]
      operationId: createOrganizationInvitationCode
      summary: Create a shareable invitation code without email (Owner only)
      description: |
        Creates a seven-day, single-use code for the chosen role. Any authenticated
        account holding the code can preview and accept it using the existing
        /v1/invitations/preview and /v1/invitations/accept token request bodies.
        No email address, verified-email lookup or SMTP service is required.
        Only a hash is stored; the code is returned once at creation, never in
        invitation lists. Owners can revoke the invitation through its existing
        invitation ID. Database invitation IDs alone cannot grant membership.
        Repeated acceptance by the same still-current member returns their existing
        membership; a different account receives invitation_accepted. Existing
        members cannot use an invitation code to raise their role.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/identity/v1/create-invitation-code-request.schema.json'
      responses:
        '201':
          description: Invitation metadata and one-time copyable code.
          content:
            application/json:
              schema:
                $ref: '../schemas/identity/v1/invitation-code-response.schema.json'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/organizations/{org_id}/invitations:
    get:
      tags: [identity]
      operationId: listOrganizationInvitations
      summary: List organization invitations
      description: Owner-only. Returns at most 100 recent invitations, including accepted, revoked and expired records.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Organization invitations.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/invitation-list-response.schema.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [identity]
      operationId: createOrganizationInvitation
      summary: Invite an email address to an organization
      description: |
        Owner-only. Sends an email containing a single-use invitation link. The
        recipient may accept with an existing or newly-created Auth0 account
        whose email address is verified and matches the invitation. Invitations
        expire after seven days. SMTP delivery must be configured on the Platform.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/create-invitation-request.schema.json"
      responses:
        "201":
          description: Invitation email sent.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/organization-invitation.schema.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: SMTP is missing or email delivery failed.
  /v1/organizations/{org_id}/invitations/{invitation_id}/resend:
    post:
      tags: [identity]
      operationId: resendOrganizationInvitation
      summary: Resend an organization invitation
      description: Owner-only. Rotates the one-use token and extends its expiry by seven days.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invitation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation email resent.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/organization-invitation.schema.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: SMTP is missing or email delivery failed.
  /v1/organizations/{org_id}/invitations/{invitation_id}:
    delete:
      tags: [identity]
      operationId: revokeOrganizationInvitation
      summary: Revoke an organization invitation
      description: Owner-only. A revoked invitation link cannot be accepted.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invitation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invitations/preview:
    post:
      tags: [identity]
      operationId: getInvitationPreview
      summary: Read invitation details
      description: Authenticated invitation link holder may preview the organization, requested role and expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/invitation-token-request.schema.json"
      responses:
        "200":
          description: Invitation preview.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/invitation-preview.schema.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invitations/accept:
    post:
      tags: [identity]
      operationId: acceptOrganizationInvitation
      summary: Accept an organization invitation
      description: |
        Requires a signed-in Auth0 account. Email-delivered invitations require a
        verified email matching the recipient. Owner-created invitation codes do
        not require an email address or SMTP; the code is the single-use grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/invitation-token-request.schema.json"
      responses:
        "200":
          description: Membership created or the same invitation acceptance replayed.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/membership.schema.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/organizations/{org_id}/robots:
    post:
      tags: [robots]
      operationId: createRobot
      summary: Create a robot
      description: |
        Owner-only. Creates a robot bound immutably to this organization and
        records a robot_created audit event. The robot is not enrolled until a
        device consumes an enrollment token.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/create-robot-request.schema.json"
      responses:
        "201":
          description: Robot created.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot.schema.json"
              examples:
                created:
                  $ref: "../fixtures/robots/v1/robot.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [robots]
      operationId: listRobots
      summary: List robots
      description: Any member may list the organization's robots. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of robots.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/robots-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/unenroll:
    post:
      tags: [robots]
      operationId: unenrollRobot
      summary: Unenroll a robot (Owner only)
      description: |
        Revokes all robot credentials and unused enrollment tokens, disconnects
        the device, clears current enrollment/support and keeps the robot record
        and history. Idle installations are detached automatically, preserving
        revisions and run history. Requires no active runs, pending operations
        or execution slots; otherwise 409 robot_has_apps with the blocking reason. Restart the updated
        Daemon once after releasing it; it verifies the durable release receipt,
        archives the previous local database and starts fresh pairing. Network
        failures, ordinary credential revocation and unknown credentials never
        authorize clearing local enrollment. A future binding gets a new namespace.
      parameters:
        - $ref: '#/components/parameters/RobotId'
      responses:
        '204':
          description: Enrollment released. The robot record remains available.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/device/enrollment-state:
    post:
      tags: [robots]
      operationId: getDeviceEnrollmentState
      summary: Read a credential-scoped enrollment release receipt
      description: |
        Proof is the credential ID and its matching secret, even when that exact
        credential is revoked/expired. This only reveals its enrollment state;
        it grants no robot/App access or mutation. Explicit owner release applies
        to credentials issued at or before the robot's release time, including
        after a different device enrolls into the same robot record. Normal
        credential revocation/expiry returns enrolled, never a reset instruction.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/robots/v1/device-authenticate-request.schema.json'
      responses:
        '200':
          description: Authenticated state receipt with no secret.
          content:
            application/json:
              schema:
                $ref: '../schemas/robots/v1/enrollment-state-response.schema.json'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/robots/{robot_id}:
    delete:
      tags: [robots]
      operationId: deleteRobot
      summary: Delete a robot (Owner only)
      description: |
        Releases enrollment as above and removes the robot from active lists and
        direct robot/access routes. Immutable history/provenance is retained and
        remains readable through run/history endpoints by organization members.
        A deleted robot cannot be enrolled or paired again. A Daemon can be paired
        to a new robot/org after restarting and verifying its release receipt.
        Idle installations are detached automatically. Active runs, execution slots
        or pending operations return 409 robot_has_apps with the blocking reason.
      parameters:
        - $ref: '#/components/parameters/RobotId'
      responses:
        '204':
          description: Robot deleted and enrollment released.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [robots]
      operationId: getRobot
      summary: Get a robot
      description: Any member of the robot's organization may read it. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "200":
          description: The robot.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/robot.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/appearance:
    put:
      tags: [robots]
      operationId: updateRobotAppearance
      summary: Owner replaces or resets a robot image or icon
      description: New Console metadata design. Persists across device reconnects; never modifies the Agent profile. Null resets to the default icon. Only the robot's workspace owner can write; non-members receive 404.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/robots/v1/update-appearance-request.schema.json" }
      responses:
        "200":
          description: Updated robot
          content:
            application/json:
              schema: { $ref: "../schemas/robots/v1/robot.schema.json" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/robots/{robot_id}/enrollment-tokens:
    post:
      tags: [robots]
      operationId: issueEnrollmentToken
      summary: Issue an enrollment token
      description: |
        Owner-only. Issues a single-use, short-lived enrollment token and
        records an enrollment_token_issued audit event. The token value is
        returned exactly once and is never retrievable again; only its SHA-256
        hash is stored. An unconsumed token can simply be left to expire.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "201":
          description: Token issued; shown once.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/enrollment-token-response.schema.json"
              examples:
                issued:
                  $ref: "../fixtures/robots/v1/enrollment-token.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/credentials:
    get:
      tags: [robots]
      operationId: listRobotCredentials
      summary: List robot credentials
      description: |
        Any member may list credential metadata. Secrets and their hashes are
        never exposed. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "200":
          description: Credential metadata, newest first.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/credential-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/credential-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [robots]
      operationId: rotateRobotCredential
      summary: Rotate the robot credential
      description: |
        Owner-only. Creates a replacement credential and bounds the rotation
        overlap by setting expires_at on the previous newest credential. The
        old credential keeps working until that expiry; the new secret is
        returned exactly once. Records a credential_rotated audit event.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "201":
          description: New credential created; secret shown once.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/rotate-credential-response.schema.json"
              examples:
                rotated:
                  $ref: "../fixtures/robots/v1/rotate.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/credentials/{credential_id}/revoke:
    post:
      tags: [robots]
      operationId: revokeRobotCredential
      summary: Revoke a robot credential
      description: |
        Owner-only. Revokes one credential immediately; it stops authenticating
        at once. Records a credential_revoked audit event. Revoking an already
        revoked credential is a no-op returning 200.
      parameters:
        - $ref: "#/components/parameters/RobotId"
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Credential revoked.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot-credential.schema.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/status:
    get:
      tags: [robots]
      operationId: getRobotStatus
      summary: Observed device status
      description: |
        Any member may read. Reports the newest accepted connection's observed
        state: last_seen_at (server receive time of the most recent message),
        daemon and protocol versions, and online derived from the freshness
        window (offline threshold 45 seconds by default). All nullable fields
        are null before the first connection; a connected robot that stops
        heartbeating goes offline without any state change.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "200":
          description: Observed status.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot-status-response.schema.json"
              examples:
                online:
                  $ref: "../fixtures/robots/v1/robot-status-online.json"
                offline:
                  $ref: "../fixtures/robots/v1/robot-status-offline.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/device/pairing-requests:
    post:
      tags: [device]
      operationId: createDevicePairingRequest
      summary: Register a daemon-generated pairing request (new design)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/pairing/v1/create-request.schema.json" }
      responses:
        "200":
          description: Pending request or idempotent replay
          content:
            application/json:
              schema: { $ref: "../schemas/pairing/v1/create-response.schema.json" }
        "409": { description: Conflicting request }
        "429": { description: Rate limited }
  /v1/device/pairing-requests/{request_id}/poll:
    post:
      tags: [device]
      operationId: pollDevicePairingRequest
      security: []
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/pairing/v1/poll-request.schema.json" }
      responses:
        "200":
          description: Pending or claimed pairing request
          content:
            application/json:
              schema: { $ref: "../schemas/pairing/v1/poll-response.schema.json" }
        "401": { description: Invalid proof }
        "410": { description: Request expired before claim }
        "429": { description: Rate limited }
  /v1/organizations/{org_id}/pairing-claims:
    post:
      tags: [robots]
      operationId: claimDevicePairing
      summary: Owner claims a code for an existing or new robot
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/pairing/v1/claim-request.schema.json" }
      responses:
        "200":
          description: Robot claimed
          content:
            application/json:
              schema: { $ref: "../schemas/robots/v1/robot.schema.json" }
        "401": { description: Authentication required }
        "403": { description: Owner role required }
        "404": { description: Pairing or robot unavailable }
        "409": { description: Code already claimed or robot enrolled }
        "429": { description: Rate limited }
  /v1/device/connect:
    get:
      tags: [device]
      operationId: connectDevice
      summary: Authenticated device WebSocket (RFC 6455)
      description: |
        This endpoint is a WebSocket handshake, not a JSON HTTP operation; the
        JSON schemas under schemas/device/v1 govern the messages. The daemon
        initiates the connection and authenticates with the headers
        x-ringfour-credential-id and x-ringfour-credential-secret; unknown,
        expired or revoked credentials are rejected with 4401 before the
        upgrade. The first message must be hello (sequence 1); the platform
        answers welcome (server time, negotiated heartbeat, session id) and
        replays commands for nonterminal operations, then dispatches new
        commands as operations are created. A newer connection for the same
        robot replaces the previous session, which receives an error message
        and is closed with 4409. Heartbeat interval is 15 s and the offline
        threshold 45 s, both platform-frozen in configuration.
      security: []
      parameters:
        - name: x-ringfour-credential-id
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: x-ringfour-credential-secret
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidToken"
  /v1/device/enroll:
    post:
      tags: [device]
      operationId: enrollDevice
      summary: Enroll a device
      description: |
        Unauthenticated by design: the enrollment token is the only proof
        required. Consumed atomically — the token works exactly once, even
        under concurrent attempts. On success the platform creates the robot's
        first credential, stamps enrolled_at and records an enrolled audit
        event in one transaction, and returns the credential secret exactly
        once. If this response is lost, an owner must issue a fresh token.
        Invalid, expired or already consumed tokens all receive 401
        invalid_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/enroll-request.schema.json"
      responses:
        "200":
          description: Enrolled; credential secret shown once.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/enroll-response.schema.json"
              examples:
                enrolled:
                  $ref: "../fixtures/robots/v1/enroll.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidToken"
  /v1/device/authenticate:
    post:
      tags: [device]
      operationId: authenticateDevice
      summary: Verify a robot credential
      description: |
        Unauthenticated by design: the robot credential is the proof. Returns
        the identity derived from the verified credential — never from
        caller-supplied claims. Unknown, expired or revoked credentials all
        receive 401 invalid_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/device-authenticate-request.schema.json"
      responses:
        "200":
          description: Credential is usable; derived identity returned.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/device-authenticate-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/device-identity.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidToken"
  /v1/device/app-runs/{run_id}/output/{stream}:
    put:
      tags: [apps]
      operationId: deliverAppRunOutput
      x-implementation-status: implemented
      security:
      - deviceCredentialId: []
        deviceCredentialSecret: []
      description: Enrolled robot credential headers authorize durable bounded byte-prefix delivery, including after run completion. Replay must match stored bytes; seal and truncation never regress.
      parameters:
      - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: stream, in: path, required: true, schema: {type: string, enum: [stdout, stderr]}}
      - {name: offset, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 65536}}
      - {name: sealed_output, in: query, required: true, schema: {type: boolean}}
      - {name: truncated, in: query, required: true, schema: {type: boolean}}
      - {name: x-ringfour-credential-id, in: header, required: true, schema: {type: string, format: uuid}}
      - {name: x-ringfour-credential-secret, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 16384}
      responses:
        '204': {description: Prefix durably acknowledged}
        '400': *id002
        '401': *id003
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/device/app-runs/{run_id}/artifacts/{artifact_id}:
    put:
      tags: [apps]
      operationId: deliverAppRunArtifact
      x-implementation-status: implemented
      security:
      - deviceCredentialId: []
        deviceCredentialSecret: []
      description: Enrolled robot credential headers authorize an immutable run artifact up to 16 MiB, at most 16 per run. Verify SHA-256 and retry exact identity/content, including after run completion.
      parameters:
      - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: artifact_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: path, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 240}}
      - {name: sha256, in: query, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
      - {name: content_type, in: query, required: true, schema: {type: string, enum: [image/jpeg, image/png, application/octet-stream]}}
      - {name: x-ringfour-credential-id, in: header, required: true, schema: {type: string, format: uuid}}
      - {name: x-ringfour-credential-secret, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 16777216}
      responses:
        '204': {description: Immutable bytes durably acknowledged}
        '400': *id002
        '401': *id003
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/app-runs/{run_id}/artifacts:
    get:
      tags: [apps]
      operationId: listAppRunArtifacts
      x-implementation-status: implemented
      parameters:
      - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Retained artifacts for this authorized run
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 16
                    items:
                      $ref: ../schemas/artifacts/v2/app-artifact.schema.json
        '400': *id002
        '409': *id006
        '503': *id008
        '401': *id003
        '403': *id004
        '404': *id005
  /v1/apps/{app_id}/artifacts:
    get:
      tags: [apps]
      operationId: listAppArtifacts
      x-implementation-status: implemented
      description: List only confirmed App artifact publications in one authorized workspace. Cursor is bound to all filters; see docs/apps-ap17-contract.md.
      parameters:
      - {name: app_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: organization_id, in: query, required: true, schema: {type: string, format: uuid}}
      - {name: installation_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: robot_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: run_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: path_prefix, in: query, required: false, schema: {type: string, maxLength: 240}}
      - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 1024}}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: Authorized artifact page, content: {application/json: {schema: {$ref: ../schemas/artifacts/v3/app-artifact-page.schema.json}}}}
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '503': *id008
  /v1/robots/{robot_id}/app-development:
    get:
      tags: [robots]
      summary: Read the current development session
      parameters:
        - in: path
          name: robot_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Current session or null.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [robots]
      summary: Open a development session
      parameters:
        - $ref: '#/components/parameters/AppIdempotencyKey'
        - in: path
          name: robot_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/apps/development/protocol.schema.json#/$defs/open"
      responses:
        "201":
          description: Development session opened.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [robots]
      summary: Close the expected development session
      parameters:
        - in: path
          name: robot_id
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: expected_session_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Development session closed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/robots/{robot_id}/app-development/grants:
    post:
      tags: [robots]
      summary: Rotate the local source grant
      parameters:
        - in: path
          name: robot_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/apps/development/protocol.schema.json#/$defs/grant"
      responses:
        "200":
          description: Grant expiry and pinned Daemon endpoint.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/device/app-development:
    get:
      tags: [robots]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      summary: Poll development state for the device
      responses:
        "200":
          description: Current session and grant metadata, or a null session.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/device/app-development/endpoint:
    put:
      tags: [robots]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      summary: Advertise the pinned development endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/apps/development/protocol.schema.json#/$defs/endpoint"
      responses:
        "204":
          description: Endpoint recorded.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/device/app-development/{session_id}/source:
    post:
      tags: [robots]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      summary: Report a committed source generation
      parameters:
        - in: path
          name: session_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/apps/development/protocol.schema.json#/$defs/source"
      responses:
        "204":
          description: Generation recorded or identical replay.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    registryUploadAuth:
      type: http
      scheme: basic
      description: Username ringfour and a short-lived repository upload credential as the password.
    deviceCredentialId:
      type: apiKey
      in: header
      name: x-ringfour-credential-id
    deviceCredentialSecret:
      type: apiKey
      in: header
      name: x-ringfour-credential-secret
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Auth0 RS256 access token. Issuer is the configured Ringfour tenant;
        audience must be https://api.ringfour.eu. Obtained via OAuth Device
        Authorization Flow (CLI) or Authorization Code + PKCE (Console).
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    RobotId:
      name: robot_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    AppIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for App mutations. Scope by principal, route and target; identical canonical input replays the original IDs/result before re-evaluating current state. Changed input conflicts. Retain a replay tombstone for the lifetime of the referenced records; no automatic expiry in the Apps v1 release.
      schema: { type: string, minLength: 1, maxLength: 200 }
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: false
      description: |
        Optional retry scope for mutation endpoints. Same principal, route,
        target and key with an identical request body replays the original
        outcome; the same key with a different body is a 409 conflict. Records
        expire after 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a previous response's next_cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; default 100, maximum 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  responses:
    Unauthenticated:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            unauthenticated:
              $ref: "../fixtures/errors/v1/unauthenticated.json"
    Forbidden:
      description: Authenticated member lacks the required role.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            forbidden:
              $ref: "../fixtures/errors/v1/forbidden.json"
    NotFound:
      description: The scoped object is missing or not accessible to the caller.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            notFound:
              $ref: "../fixtures/errors/v1/not-found.json"
    InvalidInput:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            invalidInput:
              $ref: "../fixtures/errors/v1/invalid-input.json"
    Conflict:
      description: State conflict, e.g. duplicate membership.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            conflict:
              $ref: "../fixtures/errors/v1/conflict.json"
    InvalidToken:
      description: Enrollment token or robot credential is invalid, expired, consumed or revoked.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            invalidToken:
              $ref: "../fixtures/errors/v1/invalid-token.json"
  schemas:
    Error:
      $ref: "../schemas/errors/v1/error.schema.json"
security:
  - bearerAuth: []
