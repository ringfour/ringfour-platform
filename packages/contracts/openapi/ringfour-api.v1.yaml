                ok:
                  $ref: "../fixtures/robots/v1/robots-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}:
    get:
      tags: [robots]
      operationId: getRobot
      summary: Get a robot
      description: Any member of the robot's organization may read it. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "200":
          description: The robot.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/robot.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/enrollment-tokens:
    post:
      tags: [robots]
      operationId: issueEnrollmentToken
      summary: Issue an enrollment token
      description: |
        Owner-only. Issues a single-use, short-lived enrollment token and
        records an enrollment_token_issued audit event. The token value is
        returned exactly once and is never retrievable again; only its SHA-256
        hash is stored. An unconsumed token can simply be left to expire.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "201":
          description: Token issued; shown once.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/enrollment-token-response.schema.json"
              examples:
                issued:
                  $ref: "../fixtures/robots/v1/enrollment-token.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/credentials:
    get:
      tags: [robots]
      operationId: listRobotCredentials
      summary: List robot credentials
      description: |
        Any member may list credential metadata. Secrets and their hashes are
        never exposed. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "200":
          description: Credential metadata, newest first.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/credential-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/credential-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [robots]
      operationId: rotateRobotCredential
      summary: Rotate the robot credential
      description: |
        Owner-only. Creates a replacement credential and bounds the rotation
        overlap by setting expires_at on the previous newest credential. The
        old credential keeps working until that expiry; the new secret is
        returned exactly once. Records a credential_rotated audit event.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "201":
          description: New credential created; secret shown once.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/rotate-credential-response.schema.json"
              examples:
                rotated:
                  $ref: "../fixtures/robots/v1/rotate.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/credentials/{credential_id}/revoke:
    post:
      tags: [robots]
      operationId: revokeRobotCredential
      summary: Revoke a robot credential
      description: |
        Owner-only. Revokes one credential immediately; it stops authenticating
        at once. Records a credential_revoked audit event. Revoking an already
        revoked credential is a no-op returning 200.
      parameters:
        - $ref: "#/components/parameters/RobotId"
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Credential revoked.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot-credential.schema.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/status:
    get:
      tags: [robots]
      operationId: getRobotStatus
      summary: Observed device status
      description: |
        Any member may read. Reports the newest accepted connection's observed
        state: last_seen_at (server receive time of the most recent message),
        daemon and protocol versions, and online derived from the freshness
        window (offline threshold 45 seconds by default). All nullable fields
        are null before the first connection; a connected robot that stops
        heartbeating goes offline without any state change.
      parameters:
        - $ref: "#/components/parameters/RobotId"
      responses:
        "200":
          description: Observed status.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot-status-response.schema.json"
              examples:
                online:
                  $ref: "../fixtures/robots/v1/robot-status-online.json"
                offline:
                  $ref: "../fixtures/robots/v1/robot-status-offline.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/robots/{robot_id}/operations:
    post:
      tags: [robots]
      operationId: createRobotOperation
      summary: Create a durable operation
      description: |
        Developer role or higher. Commits the operation (state queued,
        deadline from configuration) before dispatching it over the device's
        WebSocket; an offline robot simply keeps the operation queued until a
        connection arrives. v1 includes diagnostic.noop and fixed-fixture diagnostic.execution.start,
        diagnostic.execution.inspect and diagnostic.execution.stop operations.
        Start and inspect require developer; stop requires operator. See
        docs/runner-contract.md for payloads, results and recovery semantics.
        Retries: an Idempotency-Key header scoped to the caller, route and
        robot makes a repeated request with an identical body return the
        original operation (200); the same key with a different body is a 409
        conflict. Records expire after 24 hours.
      parameters:
        - $ref: "#/components/parameters/RobotId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/create-operation-request.schema.json"
      responses:
        "201":
          description: Operation committed and queued for dispatch.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/operation.schema.json"
              examples:
                queued:
                  $ref: "../fixtures/robots/v1/operation-queued.json"
        "200":
          description: Idempotency replay; the original operation is returned unchanged.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/operation.schema.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/robots/{robot_id}/operations/{operation_id}:
    get:
      tags: [robots]
      operationId: getRobotOperation
      summary: Get an operation
      description: |
        Any member may read. Poll this endpoint while waiting for a terminal
        state; terminal states (succeeded, failed, cancelled) are immutable.
        Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/RobotId"
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/operation.schema.json"
              examples:
                succeeded:
                  $ref: "../fixtures/robots/v1/operation-succeeded.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/device/pairing-requests:
    post:
      tags: [device]
      operationId: createDevicePairingRequest
      summary: Register a daemon-generated pairing request (new design)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/pairing/v1/create-request.schema.json" }
      responses:
        "200":
          description: Pending request or idempotent replay
          content:
            application/json:
              schema: { $ref: "../schemas/pairing/v1/create-response.schema.json" }
        "409": { description: Conflicting request }
        "429": { description: Rate limited }
  /v1/device/pairing-requests/{request_id}/poll:
    post:
      tags: [device]
      operationId: pollDevicePairingRequest
      security: []
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/pairing/v1/poll-request.schema.json" }
      responses:
        "200":
          description: Pending or claimed pairing request
          content:
            application/json:
              schema: { $ref: "../schemas/pairing/v1/poll-response.schema.json" }
        "401": { description: Invalid proof }
        "410": { description: Request expired before claim }
        "429": { description: Rate limited }
  /v1/organizations/{org_id}/pairing-claims:
    post:
      tags: [robots]
      operationId: claimDevicePairing
      summary: Owner claims a code for an existing or new robot
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/pairing/v1/claim-request.schema.json" }
      responses:
        "200":
          description: Robot claimed
          content:
            application/json:
              schema: { $ref: "../schemas/robots/v1/robot.schema.json" }
        "401": { description: Authentication required }
        "403": { description: Owner role required }
        "404": { description: Pairing or robot unavailable }
        "409": { description: Code already claimed or robot enrolled }
        "429": { description: Rate limited }
  /v1/device/connect:
    get:
      tags: [device]
      operationId: connectDevice
      summary: Authenticated device WebSocket (RFC 6455)
      description: |
        This endpoint is a WebSocket handshake, not a JSON HTTP operation; the
        JSON schemas under schemas/device/v1 govern the messages. The daemon
        initiates the connection and authenticates with the headers
        x-ringfour-credential-id and x-ringfour-credential-secret; unknown,
        expired or revoked credentials are rejected with 4401 before the
        upgrade. The first message must be hello (sequence 1); the platform
        answers welcome (server time, negotiated heartbeat, session id) and
        replays commands for nonterminal operations, then dispatches new
        commands as operations are created. A newer connection for the same
        robot replaces the previous session, which receives an error message
        and is closed with 4409. Heartbeat interval is 15 s and the offline
        threshold 45 s, both platform-frozen in configuration.
      security: []
      parameters:
        - name: x-ringfour-credential-id
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        - name: x-ringfour-credential-secret
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidToken"
  /v1/device/enroll:
    post:
      tags: [device]
      operationId: enrollDevice
      summary: Enroll a device
      description: |
        Unauthenticated by design: the enrollment token is the only proof
        required. Consumed atomically — the token works exactly once, even
        under concurrent attempts. On success the platform creates the robot's
        first credential, stamps enrolled_at and records an enrolled audit
        event in one transaction, and returns the credential secret exactly
        once. If this response is lost, an owner must issue a fresh token.
        Invalid, expired or already consumed tokens all receive 401
        invalid_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/enroll-request.schema.json"
      responses:
        "200":
          description: Enrolled; credential secret shown once.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/enroll-response.schema.json"
              examples:
                enrolled:
                  $ref: "../fixtures/robots/v1/enroll.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidToken"
  /v1/device/authenticate:
    post:
      tags: [device]
      operationId: authenticateDevice
      summary: Verify a robot credential
      description: |
        Unauthenticated by design: the robot credential is the proof. Returns
        the identity derived from the verified credential — never from
        caller-supplied claims. Unknown, expired or revoked credentials all
        receive 401 invalid_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/device-authenticate-request.schema.json"
      responses:
        "200":
          description: Credential is usable; derived identity returned.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/device-authenticate-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/robots/v1/device-identity.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/InvalidToken"
components:
  securitySchemes:
    deviceCredentialId:
      type: apiKey
      in: header
      name: x-ringfour-credential-id
    deviceCredentialSecret:
      type: apiKey
      in: header
      name: x-ringfour-credential-secret
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Auth0 RS256 access token. Issuer is the configured Ringfour tenant;
        audience must be https://api.ringfour.eu. Obtained via OAuth Device
        Authorization Flow (CLI) or Authorization Code + PKCE (Console).
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    RobotId:
      name: robot_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: false
      description: |
        Optional retry scope for mutation endpoints. Same principal, route,
        target and key with an identical request body replays the original
        outcome; the same key with a different body is a 409 conflict. Records
        expire after 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token from a previous response's next_cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; default 100, maximum 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
  responses:
    Unauthenticated:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            unauthenticated:
              $ref: "../fixtures/errors/v1/unauthenticated.json"
    Forbidden:
      description: Authenticated member lacks the required role.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            forbidden:
              $ref: "../fixtures/errors/v1/forbidden.json"
    NotFound:
      description: The scoped object is missing or not accessible to the caller.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            notFound:
              $ref: "../fixtures/errors/v1/not-found.json"
    InvalidInput:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            invalidInput:
              $ref: "../fixtures/errors/v1/invalid-input.json"
    Conflict:
      description: State conflict, e.g. duplicate membership.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            conflict:
              $ref: "../fixtures/errors/v1/conflict.json"
    InvalidToken:
      description: Enrollment token or robot credential is invalid, expired, consumed or revoked.
      content:
        application/json:
          schema:
            $ref: "../schemas/errors/v1/error.schema.json"
          examples:
            invalidToken:
              $ref: "../fixtures/errors/v1/invalid-token.json"
  schemas:
    Error:
      $ref: "../schemas/errors/v1/error.schema.json"
security:
  - bearerAuth: []
