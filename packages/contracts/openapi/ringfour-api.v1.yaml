      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/robots/v1/create-robot-request.schema.json"
      responses:
        "201":
          description: Robot created.
          content:
            application/json:
              schema:
                $ref: "../schemas/robots/v1/robot.schema.json"
              examples:
                created:
                  $ref: "../fixtures/robots/v1/robot.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [robots]
      operationId: listRobots
      summary: List robots
      description: Any member may list the organization's robots. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Cursor"
