openapi: 3.1.0
info:
  title: Ringfour API
  version: "0.1.0"
  description: |
    Ringfour hosted API. Current scope: health endpoints (milestone 00),
    identity/organization membership (milestone 01), robot enrollment
    (milestone 02) and device connectivity with durable operations
    (milestone 03), private Runner diagnostics (milestone 04) and script
    revisions and executions (milestone 05).
    All /v1 endpoints require an Auth0 RS256 access token for audience
    https://api.ringfour.eu and share the error envelope referenced below,
    except the /v1/device/* endpoints which authenticate by possession of an
    enrollment token or robot credential instead.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local Compose stack
tags:
  - name: health
    description: Infrastructure health; no authentication, no product data.
  - name: identity
    description: Human identity, organizations and membership (Auth0 JWT required).
  - name: robots
    description: Robot records and credential lifecycle (Auth0 JWT required).
  - name: device
    description: Local-daemon-facing enrollment, credential verification and the authenticated WebSocket connection; no human token.
  - name: scripts
    description: Script revisions, runs, output and artifacts (new Ringfour design).
  - name: dev-sessions
    description: Proposed milestone 07 development sessions (new Ringfour design; not implemented).
  - name: missions
    description: Proposed milestone 06 mission revisions and robot deployments (new Ringfour design).
  - name: logbook
    description: Milestone 08 event ingestion and organization history (new Ringfour design).
paths:
  /v1/organizations/{org_id}/events:
    get:
      tags: [logbook]
      operationId: listLogbookEvents
      description: Organization-scoped history query ordered by receipt time; preserve filters when continuing a cursor.
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: robot_id, in: query, schema: { type: string, format: uuid } }
        - { name: execution_id, in: query, schema: { type: string, format: uuid } }
        - { name: operation_id, in: query, schema: { type: string, format: uuid } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Organization-scoped Logbook entries
          content:
            application/json:
              schema: { $ref: ../schemas/logbook/v1/history-page.schema.json }
        '400': { description: Invalid filter or cursor }
        '401': { description: Authentication required }
        '404': { description: Organization inaccessible }
  /v1/device/logbook/events:
    post:
      tags: [logbook, device]
      operationId: ingestDeviceLogbookEvents
      description: Commit a contiguous device event batch before acknowledging it; the authenticated credential determines the robot. Agent motion records have no inferred Platform operation, execution, or human actor.
      security: []
      parameters:
        - { name: x-ringfour-credential-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-ringfour-credential-secret, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/logbook/v1/device-batch.schema.json }
      responses:
        '200':
          description: Highest contiguous sequence durably stored for this robot
          content:
            application/json:
              schema: { $ref: ../schemas/logbook/v1/device-checkpoint.schema.json }
        '400': { description: Invalid event or batch }
        '401': { description: Invalid machine credential }
        '409': { description: Sequence gap, conflicting replay, or mismatched robot or operation }
        '413': { description: Batch exceeds the request size limit }
        '503': { description: Durable storage unavailable }
  /v1/robots/{robot_id}/dev-sessions:
    parameters:
      - { name: robot_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [dev-sessions]
      operationId: createDevSession
      description: Proposed milestone 07 interface; accepted is not ready.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/dev-sessions/v1/create-request.schema.json }
      responses:
        '202':
          description: Session and durable creation operation accepted
          content:
            application/json:
              schema: { $ref: ../schemas/dev-sessions/v1/accepted.schema.json }
        '400': { description: Invalid request }
        '403': { description: Insufficient role }
        '404': { description: Robot inaccessible }
        '409': { description: Active session, execution, or conflicting key }
        '503': { description: Robot or storage unavailable }
  /v1/dev-sessions/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [dev-sessions]
      operationId: getDevSession
      responses:
        '200':
          description: Session state and current generation
          content:
            application/json:
              schema: { $ref: ../schemas/dev-sessions/v1/session.schema.json }
        '403': { description: Insufficient role }
        '404': { description: Session inaccessible }
    delete:
      tags: [dev-sessions]
      operationId: closeDevSession
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '202':
          description: Closure accepted; process stop and cleanup may still be pending
          content:
            application/json:
              schema: { $ref: ../schemas/dev-sessions/v1/accepted.schema.json }
        '403': { description: Not the owner or a privileged member }
        '404': { description: Session inaccessible }
        '409': { description: Conflicting key }
  /v1/device/dev-sessions/{session_id}/runs/{execution_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: x-ringfour-credential-id, in: header, required: true, schema: { type: string, format: uuid } }
      - { name: x-ringfour-credential-secret, in: header, required: true, schema: { type: string, minLength: 1 } }
    put:
      tags: [device]
      operationId: reportDevRunStatus
      description: Reports state metadata only; output and artifacts remain on the robot.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/dev-sessions/v1/device-run-status.schema.json }
      responses:
        '204': { description: Status recorded or identical replay }
        '400': { description: Invalid status }
        '401': { description: Invalid machine credential }
        '404': { description: Run inaccessible to this robot }
        '409': { description: Invalid state transition }
  /v1/device/dev-sessions/{session_id}/generations:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: x-ringfour-credential-id, in: header, required: true, schema: { type: string, format: uuid } }
      - { name: x-ringfour-credential-secret, in: header, required: true, schema: { type: string, minLength: 1 } }
    post:
      tags: [device]
      operationId: reportDevSessionGeneration
      description: Machine-authenticated durable local commit report; never receives source files or filenames.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/dev-sessions/v1/device-source-report.schema.json }
      responses:
        '204': { description: Commit recorded or identical replay }
        '400': { description: Invalid report }
        '401': { description: Invalid device credential }
        '404': { description: Session inaccessible to this robot }
        '409': { description: Stale generation or conflicting report }
  /v1/device/local-dev-endpoint:
    put:
      tags: [device]
      operationId: publishLocalDevEndpoint
      description: Device-authenticated fingerprint advertisement; robot identity comes from the machine credential.
      security: []  # Uses machine credentials, not a human access token.
      parameters:
        - { name: x-ringfour-credential-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-ringfour-credential-secret, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/dev-sessions/v1/device-endpoint.schema.json }
      responses:
        '204': { description: Endpoint advertisement recorded }
        '400': { description: Invalid fingerprint or daemon URL }
        '401': { description: Invalid device credential }
  /v1/dev-sessions/{session_id}/local-grants:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [dev-sessions]
      operationId: createDevSessionLocalGrant
      description: Proposed only. Submit a hash of a CLI-generated secret; the secret never reaches the Platform.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/dev-sessions/v1/grant-request.schema.json }
      responses:
        '202':
          description: Grant installation accepted; wait for operation success before local access.
          content:
            application/json:
              schema: { $ref: ../schemas/dev-sessions/v1/grant-accepted.schema.json }
        '400': { description: Invalid grant }
        '403': { description: Insufficient role }
        '404': { description: Session inaccessible }
        '409': { description: Session unavailable or conflicting key }
        '503': { description: Robot offline or local endpoint unavailable }
  /v1/dev-sessions/{session_id}/restart:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [dev-sessions]
      operationId: restartDevSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/dev-sessions/v1/restart-request.schema.json }
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '202':
          description: Restart accepted with reserved execution ID
          content:
            application/json:
              schema: { $ref: ../schemas/dev-sessions/v1/accepted.schema.json }
        '403': { description: Insufficient role }
        '404': { description: Session inaccessible }
        '409': { description: Missing generation, active sync or conflicting execution }
        '503': { description: Robot unavailable }
  /v1/missions:
    post:
      tags: [missions]
      operationId: createMission
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/missions/v1/create-mission-request.schema.json }
      responses:
        '201':
          description: Mission created
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/mission.schema.json }
        '200': { description: Matching idempotent replay }
        '400': { description: Invalid request }
        '403': { description: Insufficient role }
        '404': { description: Organization inaccessible }
        '409': { description: Duplicate name or conflicting key }
  /v1/organizations/{organization_id}/missions:
    parameters:
      - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
    get:
      tags: [missions]
      operationId: listMissions
      responses:
        '200':
          description: Organization-scoped mission page
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/mission-page.schema.json }
        '404': { description: Organization inaccessible }
  /v1/missions/{mission_id}/revisions:
    parameters:
      - { name: mission_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [missions]
      operationId: listMissionRevisions
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Immutable revision page in version order
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/revision-page.schema.json }
        '404': { description: Mission inaccessible }
    post:
      tags: [missions]
      operationId: publishMissionRevision
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/missions/v1/create-revision-request.schema.json }
      responses:
        '201':
          description: Immutable revision published
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/revision.schema.json }
        '200': { description: Matching idempotent replay }
        '400': { description: Invalid manifest or mismatched source }
        '403': { description: Insufficient role }
        '404': { description: Mission or source revision inaccessible }
        '409': { description: Version or idempotency conflict }
  /v1/organizations/{organization_id}/deployments:
    parameters:
      - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
    get:
      tags: [missions]
      operationId: listDeployments
      description: Read-only organization deployment records. New Ringfour design.
      responses:
        '200':
          description: Organization-scoped deployment page
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/deployment-page.schema.json }
        '404': { description: Organization inaccessible }
  /v1/missions/{mission_id}/revisions/{revision_id}/source:
    parameters:
      - { name: mission_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: revision_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [missions]
      operationId: downloadMissionSource
      description: Download the verified immutable source archive for a revision. New Ringfour design.
      responses:
        '200':
          description: Verified source ZIP
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: Mission or revision inaccessible }
        '503': { description: Source storage unavailable or invalid }
  /v1/robots/{robot_id}/deployments:
    parameters:
      - { name: robot_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    post:
      tags: [missions]
      operationId: prepareMissionDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/missions/v1/create-deployment-request.schema.json }
      responses:
        '202':
          description: Candidate preparation accepted or replayed
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/deployment-accepted.schema.json }
        '403': { description: Insufficient role }
        '404': { description: Robot or revision inaccessible }
        '409': { description: Active execution, pending candidate or conflicting key }
        '503': { description: Robot unavailable }
  /v1/deployments/{deployment_id}:
    parameters:
      - { name: deployment_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [missions]
      operationId: getDeployment
      responses:
        '200':
          description: Desired and observed deployment state
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/deployment.schema.json }
        '404': { description: Deployment inaccessible }
  /v1/deployments/{deployment_id}/{action}:
    parameters:
      - { name: deployment_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { enum: [start, stop, restart] } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    post:
      tags: [missions]
      operationId: controlDeployment
      responses:
        '202':
          description: Durable lifecycle action accepted or replayed
          content:
            application/json:
              schema: { $ref: ../schemas/missions/v1/action-accepted.schema.json }
        '403': { description: Insufficient role }
        '404': { description: Deployment inaccessible }
        '409': { description: State or idempotency conflict }
        '503': { description: Robot unavailable for start or restart }
  /v1/device/deployments/{deployment_id}/candidate:
    parameters:
      - { name: deployment_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: operation_id, in: query, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [device, missions]
      operationId: getDeviceMissionCandidate
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      responses:
        '200':
          description: Candidate ZIP bytes for the assigned pending operation
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { description: Invalid machine credential }
        '404': { description: Candidate inaccessible or no longer pending }
        '503': { description: Storage unavailable }
  /v1/script-revisions:
    post:
      tags: [scripts]
      operationId: createScriptRevision
      summary: Initiate an immutable script revision upload
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/scripts/v1/create-revision-request.schema.json }
      responses:
        '201':
          description: New upload request
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/revision.schema.json }
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/revision.schema.json }
        '400': { description: Invalid request }
        '401': { description: Invalid authentication }
        '403': { description: Insufficient role }
        '404': { description: Organization is inaccessible }
        '409': { description: Idempotency key reused for different input }
        '503': { description: Revision retention capacity reached }
  /v1/robots/{robot_id}/executions:
    parameters:
      - { name: robot_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, required: false, schema: { type: string } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
    get:
      tags: [scripts]
      operationId: listRobotExecutions
      description: Robot-scoped execution history. New Ringfour design.
      responses:
        '200':
          description: Execution page
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/execution-page.schema.json }
        '400': { description: Invalid cursor }
        '404': { description: Robot inaccessible }
  /v1/robots/{robot_id}/script-runs:
    parameters:
      - { name: robot_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    post:
      tags: [scripts]
      operationId: startScriptRun
      summary: Start an immutable script revision on an online robot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/scripts/v1/create-run-request.schema.json }
      responses:
        '202':
          description: Accepted or idempotently replayed
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/create-run-response.schema.json }
        '400': { description: Invalid request }
        '401': { description: Invalid authentication }
        '403': { description: Insufficient role }
        '404': { description: Robot or revision is inaccessible }
        '409': { description: Conflicting idempotency key or active execution }
        '503': { description: Robot is offline or retention capacity reached }
  /v1/executions/{execution_id}:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [scripts]
      operationId: getScriptExecution
      responses:
        '200':
          description: Durable execution state and requesting actor
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/execution.schema.json }
        '401': { description: Invalid authentication }
        '404': { description: Execution is inaccessible }
  /v1/executions/{execution_id}/output:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stream, in: query, required: true, schema: { enum: [stdout, stderr] } }
      - { name: offset, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 65536 } }
      - { name: limit, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 16384 } }
    get:
      tags: [scripts]
      operationId: getScriptOutput
      responses:
        '200':
          description: Byte-offset output chunk
          content:
            application/json:
              schema: { $ref: ../schemas/runner/v1/output.schema.json }
        '400': { description: Invalid range or stream }
        '401': { description: Invalid authentication }
        '404': { description: Execution is inaccessible }
  /v1/executions/{execution_id}/artifacts:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [scripts]
      operationId: listScriptArtifacts
      responses:
        '200':
          description: Uploaded, verified artifact metadata
          content:
            application/json:
              schema: { $ref: ../schemas/runner/v1/artifact-list.schema.json }
        '401': { description: Invalid authentication }
        '404': { description: Execution is inaccessible }
  /v1/executions/{execution_id}/artifacts/content:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: path, in: query, required: true, schema: { type: string, maxLength: 240 } }
    get:
      tags: [scripts]
      operationId: downloadScriptArtifact
      responses:
        '200':
          description: Verified artifact bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Invalid authentication }
        '404': { description: Execution or artifact is inaccessible }
  /v1/executions/{execution_id}/stop:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    post:
      tags: [scripts]
      operationId: stopScriptExecution
      responses:
        '202':
          description: Stop operation accepted, not yet necessarily complete
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/create-run-response.schema.json }
        '401': { description: Invalid authentication }
        '404': { description: Execution is inaccessible }
        '409': { description: Conflicting idempotency key }
        '503': { description: Robot is offline }
  /v1/device/executions/{execution_id}/revision:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [device, scripts]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      operationId: downloadDeviceRevision
      description: Authenticated by robot credential headers; scoped to the assigned execution.
      responses:
        '200':
          description: Verified immutable ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { description: Invalid machine credential }
        '404': { description: Execution is inaccessible }
        '409': { description: Execution is terminal }
        '503': { description: Storage is unavailable }
  /v1/device/executions/{execution_id}/output/{stream}:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stream, in: path, required: true, schema: { enum: [stdout, stderr] } }
      - { name: offset, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 65536 } }
    put:
      tags: [device, scripts]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      operationId: putDeviceOutput
      description: Authenticated by robot credential headers; exact-byte replay is idempotent.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Chunk durably stored or identical replay }
        '400': { description: Invalid stream or offset }
        '401': { description: Invalid machine credential }
        '404': { description: Execution is inaccessible }
        '409': { description: Gap, conflicting replay or new bytes after terminal state }
        '413': { description: Chunk or total output limit exceeded }
  /v1/device/executions/{execution_id}/artifacts:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: path, in: query, required: true, schema: { type: string, maxLength: 240 } }
      - { name: sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    put:
      tags: [device, scripts]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      operationId: putDeviceArtifact
      description: Authenticated by robot credential headers; identical artifact replay is idempotent.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Artifact verified and durably stored, or identical replay }
        '400': { description: Invalid path or digest }
        '401': { description: Invalid machine credential }
        '404': { description: Execution is inaccessible }
        '409': { description: Conflicting replay or new artifact after terminal state }
        '413': { description: Artifact or total byte limit exceeded }
        '503': { description: Storage is unavailable }
  /v1/device/executions/{execution_id}/status:
    parameters:
      - { name: execution_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [device, scripts]
      security:
        - deviceCredentialId: []
          deviceCredentialSecret: []
      operationId: putDeviceExecutionStatus
      description: Authenticated by robot credential headers; terminal status follows output and artifact uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/scripts/v1/device-status.schema.json }
      responses:
        '204': { description: State recorded or matching replay }
        '400': { description: Invalid status }
        '401': { description: Invalid machine credential }
        '404': { description: Execution is inaccessible }
        '409': { description: Invalid state transition or conflicting terminal replay }
        '413': { description: Status request exceeds the byte limit }
  /v1/script-revisions/{revision_id}/content:
    parameters:
      - { name: revision_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [scripts]
      operationId: uploadScriptRevision
      summary: Upload bounded ZIP bytes before the revision upload deadline
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Upload stored for verification }
        '400': { description: Invalid bytes or mismatched declared size or digest }
        '401': { description: Invalid authentication }
        '403': { description: Insufficient role }
        '404': { description: Revision is inaccessible }
        '409': { description: Revision is finalized or upload has expired }
        '413': { description: Upload exceeds the byte limit }
        '503': { description: Storage is unavailable }
  /v1/script-revisions/{revision_id}/finalize:
    parameters:
      - { name: revision_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [scripts]
      operationId: finalizeScriptRevision
      summary: Verify stored bytes and promote the revision
      responses:
        '200':
          description: Immutable ready revision, including idempotent replay
          content:
            application/json:
              schema: { $ref: ../schemas/scripts/v1/revision.schema.json }
        '400': { description: Archive validation or digest failed }
        '401': { description: Invalid authentication }
        '403': { description: Insufficient role }
        '404': { description: Revision is inaccessible }
        '409': { description: Upload is missing or expired }
        '503': { description: Storage is unavailable }
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Process liveness
      description: Reports only that the process is alive. Never performs dependency checks.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "../schemas/health/v1/liveness-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/health/v1/liveness-ok.json"
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness including owned dependencies
      description: |
        Checks the dependencies this service owns: API checks PostgreSQL and
        its configured private storage.
        Responds 200 when every check passes, 503 otherwise. The body uses
        the same readiness schema in both cases.
      security: []
      responses:
        "200":
          description: All dependency checks pass.
          content:
            application/json:
              schema:
                $ref: "../schemas/health/v1/readiness-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/health/v1/readiness-ok.json"
        "503":
          description: At least one dependency check fails.
          content:
            application/json:
              schema:
                $ref: "../schemas/health/v1/readiness-response.schema.json"
              examples:
                fail:
                  $ref: "../fixtures/health/v1/readiness-fail.json"
  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Resolve the caller
      description: |
        Resolves the Auth0 subject to a local user, creating the user on first
        call (safe under concurrent first requests). Returns the user and all
        of the caller's memberships.
      responses:
        "200":
          description: The caller's user and memberships.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/me-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/identity/v1/me.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/organizations:
    post:
      tags: [identity]
      operationId: createOrganization
      summary: Create an organization
      description: |
        Self-service organization creation for any authenticated user. The
        organization and the caller's owner membership are created in one
        transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/create-organization-request.schema.json"
      responses:
        "201":
          description: Organization created; the caller is its owner.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/organization.schema.json"
              examples:
                created:
                  $ref: "../fixtures/identity/v1/organization.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [identity]
      operationId: listOrganizations
      summary: List the caller's organizations
      description: Lists organizations the caller belongs to, with the caller's role in each.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of organizations.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/organization-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/identity/v1/organizations-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/organizations/{org_id}/members:
    get:
      tags: [identity]
      operationId: listMembers
      summary: List organization members
      description: Any member may list. Non-members receive 404, not 403.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of memberships.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/member-list-response.schema.json"
              examples:
                ok:
                  $ref: "../fixtures/identity/v1/members-list.json"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [identity]
      operationId: addMember
      summary: Add a member
      description: |
        Owner-only. The target user must already exist (has completed a first
        login). Adding an existing member is a 409 conflict.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/identity/v1/add-member-request.schema.json"
      responses:
        "201":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "../schemas/identity/v1/membership.schema.json"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/organizations/{org_id}/members/{user_id}:
    patch:
      tags: [identity]
      operationId: updateMemberRole
