openapi: 3.1.0
info:
  title: Ringfour runtime API
  version: '0.1.0'
  description: |
    App runtime namespace is contract-only; legacy mission runtime remains supported.
    New Ringfour-local design, separate from the Agent API. The daemon control
    listener accepts execution-scoped credentials, separate from human and LAN grants.
paths:
  /v1/app-runtime/context:
    get:
      operationId: getAppRuntimeContext
      x-implementation-status: contract-only
      description: Credential resolves run identity; no payload or URL may select another run. No engine or registry
        authority is disclosed.
      security:
      - AppRunCredential: []
      parameters: []
      responses:
        '200':
          description: Run-scoped local durable result
          content:
            application/json:
              schema:
                $ref: ../schemas/apps/v1/api.schema.json#/$defs/runtime_context
        '400':
          description: Invalid runtime input
          content:
            application/json:
              schema: &id001
                $ref: ../schemas/errors/v2/app-error.schema.json
        '401':
          description: Invalid, expired or revoked App run credential
          content:
            application/json:
              schema: *id001
        '404':
          description: Resource does not belong to credential run
          content:
            application/json:
              schema: *id001
        '409':
          description: Replay or terminal state conflict
          content:
            application/json:
              schema: *id001
        '413':
          description: Request size exceeded
          content:
            application/json:
              schema: *id001
        '503':
          description: Local storage unavailable or full
          content:
            application/json:
              schema: *id001
  /v1/app-runtime/logbook/entries:
    post:
      operationId: recordAppLogbookEntry
      x-implementation-status: contract-only
      description: At most 8192 UTF-8 bytes. Derive all attribution from run credential; persist entry and outbox
        before acknowledging. entry_id is the stable replay key.
      security:
      - AppRunCredential: []
      parameters: []
      responses:
        '200':
          description: Run-scoped local durable result
          content:
            application/json:
              schema:
                $ref: ../schemas/logbook/v1/runtime-entry-accepted.schema.json
        '400':
          description: Invalid runtime input
          content:
            application/json:
              schema: *id001
        '401':
          description: Invalid, expired or revoked App run credential
          content:
            application/json:
              schema: *id001
        '404':
          description: Resource does not belong to credential run
          content:
            application/json:
              schema: *id001
        '409':
          description: Replay or terminal state conflict
          content:
            application/json:
              schema: *id001
        '413':
          description: Request size exceeded
          content:
            application/json:
              schema: *id001
        '503':
          description: Local storage unavailable or full
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/logbook/v2/runtime-entry-request.schema.json
  /v1/app-runtime/artifacts:
    post:
      operationId: publishAppArtifact
      x-implementation-status: contract-only
      description: artifact_id is the replay key. Snapshot a regular file from this run-owned artifact area with no
        symlink/traversal escape, then persist metadata/outbox before acknowledging. No Runner dependency. Limit 16
        artifacts/run and 16 MiB/artifact.
      security:
      - AppRunCredential: []
      parameters: []
      responses:
        '200':
          description: Run-scoped local durable result
          content:
            application/json:
              schema:
                $ref: ../schemas/artifacts/v2/app-artifact.schema.json
        '400':
          description: Invalid runtime input
          content:
            application/json:
              schema: *id001
        '401':
          description: Invalid, expired or revoked App run credential
          content:
            application/json:
              schema: *id001
        '404':
          description: Resource does not belong to credential run
          content:
            application/json:
              schema: *id001
        '409':
          description: Replay or terminal state conflict
          content:
            application/json:
              schema: *id001
        '413':
          description: Request size exceeded
          content:
            application/json:
              schema: *id001
        '503':
          description: Local storage unavailable or full
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/artifacts/v1/runtime-publish-request.schema.json
  /v1/app-runtime/interactions:
    post:
      operationId: createAppInteraction
      x-implementation-status: contract-only
      description: request_id is the replay key. Derive run from credential, persist request and outbox before acknowledgement.
        Submitted answers remain provisional until applied by this run. Request limit 8192 bytes.
      security:
      - AppRunCredential: []
      parameters: []
      responses:
        '200':
          description: Run-scoped local durable result
          content:
            application/json:
              schema:
                $ref: ../schemas/interactions/v2/app-interaction.schema.json
        '400':
          description: Invalid runtime input
          content:
            application/json:
              schema: *id001
        '401':
          description: Invalid, expired or revoked App run credential
          content:
            application/json:
              schema: *id001
        '404':
          description: Resource does not belong to credential run
          content:
            application/json:
              schema: *id001
        '409':
          description: Replay or terminal state conflict
          content:
            application/json:
              schema: *id001
        '413':
          description: Request size exceeded
          content:
            application/json:
              schema: *id001
        '503':
          description: Local storage unavailable or full
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/interactions/v1/create-request.schema.json
  /v1/app-runtime/interactions/{request_id}:
    get:
      operationId: getAppInteraction
      x-implementation-status: contract-only
      description: Read only an interaction in the credential run.
      security:
      - AppRunCredential: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Run-scoped local durable result
          content:
            application/json:
              schema:
                $ref: ../schemas/interactions/v2/app-interaction.schema.json
        '400':
          description: Invalid runtime input
          content:
            application/json:
              schema: *id001
        '401':
          description: Invalid, expired or revoked App run credential
          content:
            application/json:
              schema: *id001
        '404':
          description: Resource does not belong to credential run
          content:
            application/json:
              schema: *id001
        '409':
          description: Replay or terminal state conflict
          content:
            application/json:
              schema: *id001
        '413':
          description: Request size exceeded
          content:
            application/json:
              schema: *id001
        '503':
          description: Local storage unavailable or full
          content:
            application/json:
              schema: *id001
  /v1/app-runtime/interactions/{request_id}/wait:
    get:
      operationId: waitForAppInteraction
      x-implementation-status: contract-only
      description: Bounded poll timeout leaves state pending. No deadline by default; only an explicit interaction
        deadline may produce timed_out.
      security:
      - AppRunCredential: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: wait_seconds
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 30
          default: 30
      responses:
        '200':
          description: Run-scoped local durable result
          content:
            application/json:
              schema:
                $ref: ../schemas/interactions/v2/app-interaction.schema.json
        '400':
          description: Invalid runtime input
          content:
            application/json:
              schema: *id001
        '401':
          description: Invalid, expired or revoked App run credential
          content:
            application/json:
              schema: *id001
        '404':
          description: Resource does not belong to credential run
          content:
            application/json:
              schema: *id001
        '409':
          description: Replay or terminal state conflict
          content:
            application/json:
              schema: *id001
        '413':
          description: Request size exceeded
          content:
            application/json:
              schema: *id001
        '503':
          description: Local storage unavailable or full
          content:
            application/json:
              schema: *id001
  /v1/runtime/interactions:
    post:
      operationId: createMissionInteraction
      summary: Durably create or replay one execution-scoped human interaction
      description: |
        The request_id is the mission's stable replay key. The credential supplies
        execution_id; a payload cannot select another execution. timeout_outcome
        must name one of the finite choice values and must be safe without human
        approval. A successful response means the daemon persisted the request,
        not that the hosted service received it.
      security:
        - ExecutionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/interactions/v1/create-request.schema.json }
      responses:
        '200':
          description: Interaction durably created or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '400': { description: Invalid prompt, choices, or mismatched optional deadline and timeout outcome }
        '401': { description: Missing, invalid, expired or wrong-execution credential }
        '409': { description: request_id conflicts with an earlier request }
        '503': { description: Local durable interaction storage unavailable }
  /v1/runtime/interactions/{request_id}:
    parameters:
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMissionInteraction
      summary: Read one interaction owned by this execution
      security:
        - ExecutionCredential: []
      responses:
        '200':
          description: Current daemon-authoritative state
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '401': { description: Missing, invalid, expired or wrong-execution credential }
        '404': { description: Interaction not found in this execution }
  /v1/runtime/interactions/{request_id}/wait:
    parameters:
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: wait_seconds, in: query, schema: { type: number, minimum: 0, maximum: 30, default: 30 } }
    get:
      operationId: waitForMissionInteraction
      summary: Long-poll until terminal state or the bounded poll expires
      description: A bounded poll timeout returns state pending. Interactions have no deadline by default; only an explicitly configured interaction deadline produces timed_out.
      security:
        - ExecutionCredential: []
      responses:
        '200':
          description: Current state after a transition or bounded poll expiry
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '401': { description: Missing, invalid, expired or wrong-execution credential }
        '404': { description: Interaction not found in this execution }
  /v1/runtime/artifacts:
    post:
      operationId: publishMissionArtifact
      summary: Finalize and durably queue one execution artifact
      description: A successful response means an immutable Runner snapshot and daemon queue row exist; it does not mean hosted availability.
      security:
        - ExecutionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/artifacts/v1/runtime-publish-request.schema.json }
      responses:
        '200':
          description: Locally finalized and durably queued, or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/artifacts/v1/artifact.schema.json }
        '400': { description: Invalid path, ID or content type }
        '401': { description: Missing, invalid or expired execution credential }
        '409': { description: Artifact ID conflicts with an earlier publication }
        '503': { description: Runner snapshot or daemon queue unavailable }
  /v1/runtime/logbook/entries:
    post:
      operationId: recordMissionLogbookEntry
      summary: Record a mission-authored structured entry
      description: |
        Private local endpoint. Derive execution context from the
        runtime credential and persist the entry before acknowledging. The
        entry ID provides replay; payloads must not supply execution identity.
        Maximum request body is 8192 UTF-8 bytes.
      security:
        - ExecutionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: ../schemas/logbook/v1/runtime-entry-request.schema.json }
                - { $ref: ../schemas/logbook/v2/runtime-entry-request.schema.json }
      responses:
        '200':
          description: Entry durably recorded or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/logbook/v1/runtime-entry-accepted.schema.json }
        '400': { description: Invalid entry }
        '401': { description: Missing, invalid or expired execution credential }
        '409': { description: Entry ID reused with different input }
        '413': { description: Entry exceeds the request size limit }
        '503': { description: Entry storage or outbox unavailable or full }
components:
  securitySchemes:
    AppRunCredential:
      type: http
      scheme: bearer
      description: Proposed per-run credential verified by Daemon against durable run ownership and expiry; no Runner, human or registry authority.
    ExecutionCredential:
      type: http
      scheme: bearer
      description: Per-execution bearer verified against Runner state; no human token.
