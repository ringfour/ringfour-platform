openapi: 3.1.0
info:
  title: Ringfour runtime API
  version: '0.1.0'
  description: |
    The Daemon serves local App runtime requests with a per-run bearer credential.
    Robot-control calls use the separate Agent API.
paths:
  /v1/runtime/interactions:
    post:
      operationId: createMissionInteraction
      summary: Durably create or replay one execution-scoped human interaction
      description: |
        The request_id is the App run's stable replay key. The credential supplies
        execution_id; a payload cannot select another execution. timeout_outcome
        must name one of the finite choice values and must be safe without human
        approval. A successful response means the daemon persisted the request,
        not that the hosted service received it.
      security:
        - ExecutionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/interactions/v1/create-request.schema.json }
      responses:
        '200':
          description: Interaction durably created or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '400': { description: Invalid prompt, choices, or mismatched optional deadline and timeout outcome }
        '401': { description: Missing, invalid, expired or wrong-execution credential }
        '409': { description: request_id conflicts with an earlier request }
        '503': { description: Local durable interaction storage unavailable }
  /v1/runtime/interactions/{request_id}:
    parameters:
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMissionInteraction
      summary: Read one interaction owned by this execution
      security:
        - ExecutionCredential: []
      responses:
        '200':
          description: Current daemon-authoritative state
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '401': { description: Missing, invalid, expired or wrong-execution credential }
        '404': { description: Interaction not found in this execution }
  /v1/runtime/interactions/{request_id}/wait:
    parameters:
      - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: wait_seconds, in: query, schema: { type: number, minimum: 0, maximum: 30, default: 30 } }
    get:
      operationId: waitForMissionInteraction
      summary: Long-poll until terminal state or the bounded poll expires
      description: A bounded poll timeout returns state pending. Interactions have no deadline by default; only an explicitly configured interaction deadline produces timed_out.
      security:
        - ExecutionCredential: []
      responses:
        '200':
          description: Current state after a transition or bounded poll expiry
          content:
            application/json:
              schema: { $ref: ../schemas/interactions/v1/interaction.schema.json }
        '401': { description: Missing, invalid, expired or wrong-execution credential }
        '404': { description: Interaction not found in this execution }
  /v1/runtime/artifacts:
    post:
      operationId: publishMissionArtifact
      summary: Finalize and durably queue one execution artifact
      description: A successful response means an immutable artifact snapshot and daemon queue row exist; it does not mean hosted availability.
      security:
        - ExecutionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/artifacts/v1/runtime-publish-request.schema.json }
      responses:
        '200':
          description: Locally finalized and durably queued, or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/artifacts/v1/artifact.schema.json }
        '400': { description: Invalid path, ID or content type }
        '401': { description: Missing, invalid or expired execution credential }
        '409': { description: Artifact ID conflicts with an earlier publication }
        '503': { description: Artifact snapshot or Daemon queue unavailable }
  /v1/runtime/settings/pending:
    get:
      operationId: pollAppRunSettings
      x-implementation-status: implemented
      summary: Poll the authenticated run for its one pending initial or live settings application
      description: The run credential selects the run. The Daemon returns only a durable queued application for this exact run; bounded long poll is 1–30 seconds and a timeout remains unresolved.
      security:
        - AppRunCredential: []
      parameters:
        - { name: wait_seconds, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 30, default: 10 } }
      responses:
        '200':
          description: Pending application or explicit empty result
          content:
            application/json:
              schema: { $ref: ../schemas/apps/v2/settings.schema.json#/$defs/runtime_pending }
        '400':
          description: Invalid wait duration
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '401':
          description: Missing, invalid, expired or terminal run credential
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '404':
          description: Run no longer exists in local runtime state
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '409':
          description: Run is terminal or settings delivery state conflicts
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '503':
          description: Local pending-settings store unavailable
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
  /v1/runtime/settings/{application_id}/result:
    post:
      operationId: reportAppRunSettingsResult
      x-implementation-status: implemented
      summary: Durably record the App's applied or rejected settings result
      description: The credential determines run ownership. The Daemon persists the same application ID and result before acknowledging; retries with identical content are idempotent.
      security:
        - AppRunCredential: []
      parameters:
        - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/apps/v2/settings.schema.json#/$defs/runtime_result }
      responses:
        '200':
          description: Result durably recorded or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/apps/v2/settings.schema.json#/$defs/runtime_result_accepted }
        '400':
          description: Invalid values or bounded rejection reason
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '401':
          description: Missing, invalid, expired or terminal run credential
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '404':
          description: Application ID does not belong to this run
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '409':
          description: Conflicting result replay or run ended before application
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
        '413': { description: Request exceeds 16,384 UTF-8 bytes }
        '503':
          description: Local result/outbox store unavailable or full
          content:
            application/json:
              schema: { $ref: ../schemas/errors/v2/app-error.schema.json }
  /v1/runtime/logbook/entries:
    post:
      operationId: recordMissionLogbookEntry
      summary: Record an App-authored structured entry
      description: |
        Private local endpoint. Derive execution context from the
        runtime credential and persist the entry before acknowledging. The
        entry ID provides replay; payloads must not supply execution identity.
        Maximum request body is 8192 UTF-8 bytes.
      security:
        - ExecutionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: ../schemas/logbook/v1/runtime-entry-request.schema.json }
                - { $ref: ../schemas/logbook/v2/runtime-entry-request.schema.json }
      responses:
        '200':
          description: Entry durably recorded or identical replay
          content:
            application/json:
              schema: { $ref: ../schemas/logbook/v1/runtime-entry-accepted.schema.json }
        '400': { description: Invalid entry }
        '401': { description: Missing, invalid or expired execution credential }
        '409': { description: Entry ID reused with different input }
        '413': { description: Entry exceeds the request size limit }
        '503': { description: Entry storage or outbox unavailable or full }
components:
  securitySchemes:
    AppRunCredential:
      type: http
      scheme: bearer
      description: Per-run bearer verified by the Daemon against durable run ownership and expiry.
    ExecutionCredential:
      type: http
      scheme: bearer
      description: Per-run bearer verified against Daemon-owned App run state.
