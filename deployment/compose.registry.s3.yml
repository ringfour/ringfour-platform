services:
  app-registry:
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: !reset null
      REGISTRY_STORAGE_S3_REGION: ${RINGFOUR_REGISTRY_S3_REGION:?Set the bucket region}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${RINGFOUR_REGISTRY_S3_ENDPOINT:?Set the S3-compatible HTTPS endpoint}
      REGISTRY_STORAGE_S3_BUCKET: ${RINGFOUR_REGISTRY_S3_BUCKET:?Set the private registry bucket}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${RINGFOUR_REGISTRY_S3_ACCESS_KEY:?Set the bucket access key}
      REGISTRY_STORAGE_S3_SECRETKEY: ${RINGFOUR_REGISTRY_S3_SECRET_KEY:?Set the bucket secret key}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_S3_SECURE: "true"
