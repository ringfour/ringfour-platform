# Explicit operator opt-in; merge with ringfour-virtual/compose.yaml.
# Keep the current Compose project/environment to preserve enrollment and volumes.
services:
  daemon:
    environment:
      RINGFOUR_APPS_ENABLED: "true"
      RINGFOUR_ENGINE_SOCKET: /var/run/docker.sock
      RINGFOUR_APP_NETWORK: ${BASE101_NETWORK_NAME:-base101_default}
    group_add:
      - ${RINGFOUR_ENGINE_SOCKET_GID:?Supply the actual engine socket group GID}
    volumes:
      - type: bind
        source: ${RINGFOUR_ENGINE_SOCKET_HOST_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
