name: Platform component tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test apps/api/Ringfour.slnx

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements-test.txt
      - run: npm run test:openapi

  python-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cli, daemon]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check src tests

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --python 3.13 --with pytest pytest -q tests
