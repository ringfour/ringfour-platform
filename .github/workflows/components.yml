name: Platform component tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  api:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13
        working-directory: apps/daemon
      - run: dotnet test apps/api/Ringfour.slnx

  console:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements-test.txt
      - run: npm run test:openapi

  python-apps:
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        app: [cli, daemon]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check src tests

  runtime:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: packages/python-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --python 3.13 --with pytest pytest -q tests

  release-scripts:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          for script in cli-installer.sh deployment/deployment.sh deployment/robot-update.sh; do
            sh -n "$script"
          done
          python -m py_compile scripts/package-cli-release.py
          python -m py_compile scripts/build-python-artifacts.py

  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, console, contracts, python-apps, runtime, release-scripts]
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    env:
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AUTH0_CLI_CLIENT_ID: ${{ vars.AUTH0_CLI_CLIENT_ID }}
      AUTH0_WEB_CLIENT_ID: ${{ vars.AUTH0_WEB_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE || 'https://api.ringfour.eu' }}
      RINGFOUR_API_URL: ${{ vars.RINGFOUR_API_URL }}
      RELEASE_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_PREFIX: ghcr.io/ringfour/ringfour-platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read App wheel bundle pins
        id: bundle
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          release = json.loads(Path("packages/python-artifacts/release.json").read_text())
          sdk = next(package for package in release["packages"] if package["name"] == "ringfour-sdk")
          print(f"sdk_commit={sdk['commit']}")
          print(f"uv_version={release['uv_version']}")
          print(f"version={release['bundle_version']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ringfour/ringfour-sdk
          ref: ${{ steps.bundle.outputs.sdk_commit }}
          token: ${{ secrets.RINGFOUR_SDK_READ_TOKEN || github.token }}
          persist-credentials: false
          path: .ci-sources/ringfour-sdk
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.bundle.outputs.uv_version }}
      - name: Build App wheel bundle
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          ln -s "$GITHUB_WORKSPACE" .ci-sources/ringfour-platform
          python scripts/build-python-artifacts.py --source-root .ci-sources \
            --output ".ci-sources/bundles/$BUNDLE_VERSION"
          mkdir -p dist
          tar -C .ci-sources/bundles -czf dist/python-artifacts.tar.gz "$BUNDLE_VERSION"
          rm -rf .ci-sources
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and test CLI
        run: |
          python scripts/package-cli-release.py
          uv build --wheel --python 3.13 --out-dir "$PWD/dist" apps/cli
          uv tool run --isolated --python 3.13 --from "$(realpath dist/*.whl)" ringfour-cli --help
          uv tool run --isolated --python 3.13 --from "$(realpath dist/*.whl)" ringfour-cli app bundle fetch --help
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ env.RELEASE_IMAGE_TAG }}
      - uses: docker/build-push-action@v6
        id: studio
        with:
          context: apps/console
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-studio:${{ env.RELEASE_IMAGE_TAG }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ env.AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ env.AUTH0_WEB_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ env.AUTH0_AUDIENCE }}
      - uses: docker/build-push-action@v6
        id: daemon
        with:
          context: apps/daemon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-daemon:${{ env.RELEASE_IMAGE_TAG }}
      - name: Assemble release and smoke test the images
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          STUDIO_DIGEST: ${{ steps.studio.outputs.digest }}
          DAEMON_DIGEST: ${{ steps.daemon.outputs.digest }}
        run: |
          printf 'RINGFOUR_API_IMAGE=%s-api@%s\nRINGFOUR_STUDIO_IMAGE=%s-studio@%s\n' \
            "$IMAGE_PREFIX" "$API_DIGEST" "$IMAGE_PREFIX" "$STUDIO_DIGEST" > dist/images.env
          printf '%s-daemon@%s\n' "$IMAGE_PREFIX" "$DAEMON_DIGEST" > dist/daemon-image.txt
          python -c 'import runpy; print(runpy.run_path("apps/daemon/src/ringfour_daemon/__init__.py")["__version__"])' > dist/daemon-version.txt
          cp deployment/compose.yml deployment/compose.registry.yml deployment/compose.registry.s3.yml deployment/deployment.sh deployment/.env.example deployment/README.md dist/
          # Expose optional release-feed settings in the published Compose asset.
          python - <<'PYRELEASE'
          from pathlib import Path
          path = Path('dist/compose.yml')
          source = path.read_text()
          anchor = '      Apps__LiveSettingsEnabled: ${APPS_LIVE_SETTINGS_ENABLED:-false}\n'
          assert source.count(anchor) == 1
          path.write_text(source.replace(anchor, anchor +
              '      Apps__RecommendedAgentVersion: ${APPS_RECOMMENDED_AGENT_VERSION:-}\n' +
              '      Apps__RecommendedDaemonVersion: ${APPS_RECOMMENDED_DAEMON_VERSION:-}\n' +
              '      ReleaseVersions__GitHubToken: ${RELEASE_VERSIONS_GITHUB_TOKEN:-}\n'))
          PYRELEASE
          cp deployment/robot-update.sh deployment/robot-update.service deployment/robot-update.timer dist/
          tar -C dist -czf deployment.tar.gz compose.yml compose.registry.yml compose.registry.s3.yml deployment.sh .env.example README.md images.env
          mv deployment.tar.gz dist/
          rm dist/compose.yml dist/compose.registry.yml dist/compose.registry.s3.yml dist/deployment.sh dist/.env.example dist/README.md dist/images.env
          (cd dist && sha256sum ./*.whl ./python-artifacts.tar.gz ./deployment.tar.gz ./daemon-image.txt ./daemon-version.txt ./robot-update.* | sed 's|  \./|  |' > SHA256SUMS)
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export CONSOLE_ORIGIN=http://127.0.0.1:5173
          export API_PORT= CONSOLE_PORT=
          smoke="$(mktemp -d)"
          project="ringfour-release-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          compose=(docker compose -p "$project" --env-file "$smoke/images.env" -f "$smoke/compose.yml")
          cleanup() {
            docker rm -f "$project-daemon" >/dev/null 2>&1 || true
            "${compose[@]}" down -v
            rm -rf "$smoke"
          }
          trap cleanup EXIT
          tar -xzf dist/deployment.tar.gz -C "$smoke"
          docker run -d --name "$project-daemon" -p 127.0.0.1::8081 \
            -e RINGFOUR_APPS_ENABLED=false "$IMAGE_PREFIX-daemon@$DAEMON_DIGEST"
          daemon_address="$(docker port "$project-daemon" 8081/tcp)"
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors "http://$daemon_address/health/live"
          "${compose[@]}" up -d --wait --wait-timeout 180
          studio_address="$("${compose[@]}" port console 80)"
          curl -fsS "http://$studio_address/" >/dev/null
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors "http://$studio_address/api/health/ready"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-release
          overwrite: true
          path: dist/
          if-no-files-found: error

  release-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-build
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    concurrency:
      group: platform-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Prepare release asset directory
        id: assets
        run: printf 'directory=%s\n' "$(mktemp -d "$RUNNER_TEMP/platform-release.XXXXXX")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: platform-release
          path: ${{ steps.assets.outputs.directory }}
      - name: Publish complete build
        env:
          RELEASE_ASSET_DIR: ${{ steps.assets.outputs.directory }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit is queued. Skipping publication.'
            exit 0
          fi
          tag="main-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$RELEASE_ASSET_DIR"/* --target "$GITHUB_SHA" --latest \
            --title "Main ${GITHUB_SHA:0:12}" --notes "Source commit: $GITHUB_SHA"
