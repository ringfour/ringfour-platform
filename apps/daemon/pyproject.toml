[project]
name = "ringfour-daemon"
dynamic = ["version"]
description = "Ringfour device coordinator daemon: owns device lifecycle, durable SQLite state."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ringfour_daemon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ringfour_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
